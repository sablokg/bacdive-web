[package]
name = "bacdive"
version = "0.10.0"
edition = "2021"
readme = "README.md"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "bacdive for microbial genomics"
homepage = "https://codeberg.org/gsablok/bacdive"
repository = "https://codeberg.org/gsablok/bacdive"
keywords = ["bioinformatics","genomics"]

[lib]
name = "bacdive"
path = "src/lib.rs"

[[bin]]
name = "bacdive"
path = "src/main.rs"

[[bin]]
name = "bacdive-web"
path = "src/bin/server.rs"

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
figlet-rs = "0.1.5"
futures = "0.3.31"
rayon = "1.11.0"
reqwest = { version = "0.12.23", features = ["blocking"] }
rusqlite = "0.33.0"
scraper = { version = "0.22.0", features = ["errors", "getopts", "main"] }
select = "0.6.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
tabled = "0.18.0"
tokio = { version = "1.47.1", features = ["full"] }
axum = "0.7.9"
tower-http = { version = "0.6.2", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
